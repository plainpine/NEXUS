{% extends "base.html" %}

{% block content %}
<style>
    .weight-group { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 15px; flex-wrap: nowrap;}
    .norm-val { font-weight: bold; color: var(--primary); min-width: 40px; text-align: center; margin-bottom: 8px;}
    .input-wrapper { display: flex; flex-direction: column; gap: 5px; min-width: 90px; }
    .input-wrapper label { font-size: 0.8rem; font-weight: normal; color: #555; }
    .score-input { width: 80px; }
    .weight-input { width: 80px; }
    .form-group { margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
</style>
<div class="header">
    <h1>マッチング重み設定</h1>
</div>

<div class="card" style="max-width: 900px;">
    <form method="post" id="weightForm">
        <h3>1. 科目設定</h3>
        <div class="form-group">
            <label>科目適性得点と重み</label>
            <div class="weight-group">
                <div class="input-wrapper"><label>得意</label><input type="number" name="prof_excellent" class="score-input" value="{{ configs.get('prof_excellent', 10) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>対応可</label><input type="number" name="prof_good" class="score-input" value="{{ configs.get('prof_good', 5) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不得意</label><input type="number" name="prof_poor" class="score-input" value="{{ configs.get('prof_poor', 0) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>カテゴリ重み</label><input type="number" step="0.1" name="weight_subject" class="weight-input" value="{{ configs.get('weight_subject', 1.0) }}"></div>
            </div>
            <small>科目ごとの評価スコアと、科目項目全体の重要度です。</small>
        </div>
        <div class="form-group">
            <label for="subject_mismatch_penalty">科目不一致ペナルティ</label>
            <input type="number" name="subject_mismatch_penalty" id="subject_mismatch_penalty" value="{{ configs.get('subject_mismatch_penalty', -40) }}">
            <small>希望科目が不得意な講師に割り当てた場合の減点。</small>
        </div>

        <h3>2. 性別設定</h3>
        <div class="form-group">
            <label>講師希望の性別マッチ</label>
            <div class="weight-group">
                <div class="input-wrapper"><label>一致</label><input type="number" name="gender_match_teacher" class="score-input" value="{{ configs.get('gender_match_teacher', 5) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不問</label><input type="number" name="gender_no_pref_teacher" class="score-input" value="{{ configs.get('gender_no_pref_teacher', 0) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不一致</label><input type="number" name="gender_mismatch_teacher" class="score-input" value="{{ configs.get('gender_mismatch_teacher', -5) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_gender_t" class="weight-input" value="{{ configs.get('weight_gender_t', 1.0) }}"></div>
            </div>
        </div>
        <div class="form-group">
            <label>生徒希望の性別マッチ</label>
            <div class="weight-group">
                <div class="input-wrapper"><label>一致</label><input type="number" name="gender_match_student" class="score-input" value="{{ configs.get('gender_match_student', 5) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不問</label><input type="number" name="gender_no_pref_student" class="score-input" value="{{ configs.get('gender_no_pref_student', 0) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不一致</label><input type="number" name="gender_mismatch_student" class="score-input" value="{{ configs.get('gender_mismatch_student', -5) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_gender_s" class="weight-input" value="{{ configs.get('weight_gender_s', 1.0) }}"></div>
            </div>
        </div>

        <h3>3. 年齢・学年設定</h3>
        <div class="form-group">
            <label>講師希望の学年マッチ</label>
            <div class="weight-group">
                <div class="input-wrapper"><label>一致</label><input type="number" name="grade_match_teacher" class="score-input" value="{{ configs.get('grade_match_teacher', 20) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不問</label><input type="number" name="grade_no_pref_teacher" class="score-input" value="{{ configs.get('grade_no_pref_teacher', 10) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不一致</label><input type="number" name="grade_mismatch_teacher" class="score-input" value="{{ configs.get('grade_mismatch_teacher', 0) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_grade" class="weight-input" value="{{ configs.get('weight_grade', 1.0) }}"></div>
            </div>
        </div>
        <div class="form-group">
            <label>生徒希望の年齢マッチ</label>
            <div class="weight-group">
                <div class="input-wrapper"><label>一致</label><input type="number" name="age_match_student" class="score-input" value="{{ configs.get('age_match_student', 20) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不問</label><input type="number" name="age_no_pref_student" class="score-input" value="{{ configs.get('age_no_pref_student', 10) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>不一致</label><input type="number" name="age_mismatch_student" class="score-input" value="{{ configs.get('age_mismatch_student', 0) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_age" class="weight-input" value="{{ configs.get('weight_age', 1.0) }}"></div>
            </div>
        </div>

        <h3>4. アルゴリズム設定</h3>
        <div class="form-group">
            <label for="num_reads">サンプリング回数</label>
            <input type="number" name="num_reads" id="num_reads" value="{{ configs.get('num_reads', 100) }}">
            <small>アニーリングの探索回数。大きいほど良い結果が得られやすい。</small>
        </div>

        <h3>5. 過去実績設定</h3>
        <div class="form-group">
            <label for="recency_bias">直近評価重視度</label>
            <input type="number" step="0.1" name="recency_bias" id="recency_bias" value="{{ configs.get('recency_bias', 0.1) }}">
            <small>古い評価よりも直近の評価をどれだけ重く扱うか。</small>
        </div>

        <p><strong>講師評価スコア</strong></p>
        <div class="form-group">
            <div class="weight-group">
                <div class="input-wrapper"><label>よくできた</label><input type="number" name="eval_t_ach_4" class="score-input" value="{{ configs.get('eval_t_ach_4', 2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>できた</label><input type="number" name="eval_t_ach_3" class="score-input" value="{{ configs.get('eval_t_ach_3', 1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>あまりできない</label><input type="number" name="eval_t_ach_2" class="score-input" value="{{ configs.get('eval_t_ach_2', -1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>できない</label><input type="number" name="eval_t_ach_1" class="score-input" value="{{ configs.get('eval_t_ach_1', -2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_eval_t_ach" class="weight-input" value="{{ configs.get('weight_eval_t_ach', 1.0) }}"></div>
            </div>
            <div class="weight-group">
                <div class="input-wrapper"><label>とても教えやすい</label><input type="number" name="eval_t_tea_4" class="score-input" value="{{ configs.get('eval_t_tea_4', 2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>教えやすい</label><input type="number" name="eval_t_tea_3" class="score-input" value="{{ configs.get('eval_t_tea_3', 1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>少し教えにくい</label><input type="number" name="eval_t_tea_2" class="score-input" value="{{ configs.get('eval_t_tea_2', -1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>教えにくい</label><input type="number" name="eval_t_tea_1" class="score-input" value="{{ configs.get('eval_t_tea_1', -2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_eval_t_tea" class="weight-input" value="{{ configs.get('weight_eval_t_tea', 1.0) }}"></div>
            </div>
        </div>

        <p><strong>生徒の感想スコア</strong></p>
        <div class="form-group">
            <div class="weight-group">
                <div class="input-wrapper"><label>よくできた</label><input type="number" name="eval_s_ach_4" class="score-input" value="{{ configs.get('eval_s_ach_4', 2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>できた</label><input type="number" name="eval_s_ach_3" class="score-input" value="{{ configs.get('eval_s_ach_3', 1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>あまりできない</label><input type="number" name="eval_s_ach_2" class="score-input" value="{{ configs.get('eval_s_ach_2', -1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>できない</label><input type="number" name="eval_s_ach_1" class="score-input" value="{{ configs.get('eval_s_ach_1', -2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_eval_s_ach" class="weight-input" value="{{ configs.get('weight_eval_s_ach', 1.0) }}"></div>
            </div>
            <div class="weight-group">
                <div class="input-wrapper"><label>とても学習しやすい</label><input type="number" name="eval_s_lea_4" class="score-input" value="{{ configs.get('eval_s_lea_4', 2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>学習しやすい</label><input type="number" name="eval_s_lea_3" class="score-input" value="{{ configs.get('eval_s_lea_3', 1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>少し学習しにくい</label><input type="number" name="eval_s_lea_2" class="score-input" value="{{ configs.get('eval_s_lea_2', -1) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>学習しにくい</label><input type="number" name="eval_s_lea_1" class="score-input" value="{{ configs.get('eval_s_lea_1', -2) }}"></div><span class="norm-val"></span>
                <div class="input-wrapper"><label>重み</label><input type="number" step="0.1" name="weight_eval_s_lea" class="weight-input" value="{{ configs.get('weight_eval_s_lea', 1.0) }}"></div>
            </div>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a href="{{ url_for('matching_setup') }}" class="btn btn-outline">キャンセル</a>
        </div>
    </form>
</div>

<script>
    function normalize() {
        document.querySelectorAll('.weight-group').forEach(group => {
            const scoreInputs = group.querySelectorAll('.score-input');
            const scores = Array.from(scoreInputs).map(i => parseFloat(i.value) || 0);
            
            const max = Math.max(...scores);
            const min = Math.min(...scores);
            const range = max - min || 1;
            
            scoreInputs.forEach((input, index) => {
                const val = parseFloat(input.value) || 0;
                const normVal = (val - min) / range;
                const display = normVal.toFixed(2);
                
                // inputの次の兄弟要素であるspanを更新
                let next = input.parentElement.nextElementSibling;
                if (next && next.classList.contains('norm-val')) {
                    next.textContent = display;
                }
            });
        });
    }
    document.getElementById('weightForm').addEventListener('change', normalize);
    normalize();
</script>
{% endblock %}
