<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-container">

<div class="login-card">
    <h1>NEXUS</h1>
    <p>マッチングシステムへログイン</p>
    <form method="post">
        {% if request.args.get('error') %}
        <div style="color: red; margin-bottom: 10px; font-weight: bold;">
            {{ request.args.get('error') }}
        </div>
        {% endif %}
        {#
        {% if request.args.get('debug') %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; border: 1px solid #f5c6cb; border-radius: 4px; text-align: left;">
            <strong>[API Debug]</strong> {{ request.args.get('debug') }}
        </div>
        {% endif %}
        #}
        <input type="text" name="username" placeholder="ユーザID" required style="width: 100%; margin-bottom: 10px;">
        <input type="password" name="password" placeholder="パスワード" required style="width: 100%; margin-bottom: 10px;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">ログイン</button>
    </form>
</div>

</body>
</html>
