{% extends "base.html" %}

{% block content %}

<div class="header">
    <h1>生徒のプロフィール</h1>
</div>

{% if error %}
<div style="background-color: #f8d7da; color: #721c24; padding: 1rem; margin-bottom: 1rem; border: 1px solid #f5c6cb; border-radius: 0.25rem;">
    {{ error }}
</div>
{% endif %}

<div class="card" style="max-width: 600px;">
    <form method="post">
        <div class="form-group">
            <label for="name">氏名</label>
            <input name="name" id="name" required placeholder="氏名を入力" value="{{ student.name if student else '' }}">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="grade">学年</label>
                <select name="grade" id="grade">
                    <option {{ 'selected' if student and student.grade == '中1' }}>中1</option>
                    <option {{ 'selected' if student and student.grade == '中2' }}>中2</option>
                    <option {{ 'selected' if student and student.grade == '中3' }}>中3</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gender">性別</label>
                <select name="gender" id="gender">
                    <option {{ 'selected' if student and student.gender == '男' }}>男</option>
                    <option {{ 'selected' if student and student.gender == '女' }}>女</option>
                </select>
            </div>
        </div>

        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border);">
        
        <h3 style="margin-bottom: 1rem; font-size: 1rem;">希望する条件</h3>
        <div class="form-group">
            <label for="default_venue_id">デフォルトの会場</label>
            <select name="default_venue_id" id="default_venue_id" style="max-width: 200px;">
                {% if not venues %}
                <option value="">設定なし</option>
                {% endif %}
                {% for venue in venues %}
                <option value="{{ venue.id }}" {{ 'selected' if student and student.default_venue_id == venue.id }}>{{ venue.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="pref_gender">希望する講師の性別</label>
            <select name="pref_gender" id="pref_gender" style="max-width: 200px;">
                <option {{ 'selected' if student and student.pref_gender == '不問' }}>不問</option>
                <option {{ 'selected' if student and student.pref_gender == '男' }}>男</option>
                <option {{ 'selected' if student and student.pref_gender == '女' }}>女</option>
            </select>
        </div>
        <label>希望する講師の年代</label>
        <div class="form-group">
            <select name="pref_age_priority" id="pref_age_priority" style="max-width: 200px;">
                <option value="不問" {{ 'selected' if student and student.pref_age1020_priority == 2 and student.pref_age3040_priority == 2 and student.pref_age50_priority == 2 }}>不問</option>
                <option value="ヤング" {{ 'selected' if student and student.pref_age1020_priority == 1 }}>ヤング</option>
                <option value="アダルト" {{ 'selected' if student and student.pref_age50_priority == 1 }}>アダルト</option>
            </select>
        </div>

        <h3 style="margin-top: 2rem;">ログイン情報</h3>
        <div class="form-group">
            <label for="username">ユーザID</label>
            <input name="username" id="username" required placeholder="ユーザID" value="{{ student.user.username if student and student.user else '' }}" 
                   {% if student %}readonly style="background-color: #e9ecef;"{% endif %}>
        </div>
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" name="password" id="password" {{ 'required' if not student else '' }} placeholder="パスワードを入力">
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button class="btn btn-primary">保存する</button>
            <a href="{{ url_for('student_dashboard') if not is_admin else url_for('students') }}" class="btn btn-outline">キャンセル</a>
        </div>
    </form>
</div>

{% endblock %}
